# https://plugins.gradle.org/plugin/io.micronaut.application
# Gradle plugin that provides a one-stop-stop for minimal builds of a Micronaut server application written in Java.
# It extends the Micronaut Library plugin and adds the following customizations:
# instead of the java-library plugin the plugin applies the Gradle application plugin
# - Applies the io.micronaut.graalvm plugin
# - Correctly configures Gradle for continuous build
# - The following additional tasks are provided by this plugin: buildLayers, dockerfile, dockerBuild, nativeCompile, ...
micronautGradlePluginVersion=4.6.1

# Specifies the version for the Micronaut Bill of Materials (BOM)
# https://central.sonatype.com/artifact/io.micronaut.platform/micronaut-platform?smo=true
# The minimum requirement is to set the Micronaut version to use. Since Micronaut 4, this is the version of the Micronaut Platform.
# In previous releases, they were bound to the version of Micronaut Core. The easiest way is to set micronautVersion in gradle.properties.
micronautVersion=4.7.4


